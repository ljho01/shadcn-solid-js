name: Publish Remaining Packages

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish 6 remaining packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

      - name: Publish remaining packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGES=(
            use-controllable-state
            use-effect-event
            use-escape-keydown
            use-previous
            use-rect
            use-size
          )

          SUCCESS=0
          FAIL=0

          for pkg in "${PACKAGES[@]}"; do
            echo "Publishing @radix-solid-js/$pkg ..."
            cd "$GITHUB_WORKSPACE/packages/solid/$pkg"

            if npm publish --access public; then
              echo "✅ $pkg"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "❌ $pkg"
              FAIL=$((FAIL + 1))
            fi

            sleep 10
          done

          echo ""
          echo "Result: Success=$SUCCESS / Failed=$FAIL / Total=${#PACKAGES[@]}"

          if [ $FAIL -gt 0 ]; then
            exit 1
          fi
